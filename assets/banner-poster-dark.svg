<title id="t">실패는 성공의 어머니! slop-compost</title><desc id="d">Retro propaganda-poster parody: a green sprout bursts from a compost mound of discarded code brackets, crumpled paper and a broken lightbulb, in front of a sunburst. Failure is the mother of success. Your slop is compost for the next idea.</desc>
